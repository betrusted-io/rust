name: Rust for Xous

on: [push]

jobs:
  build-libstd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: 'recursive'

      - name: Setup riscv gnu/gcc toolchain
        run: |
          # Download the nightly release archive
          wget -q https://github.com/riscv-collab/riscv-gnu-toolchain/releases/download/2026.10.26/riscv32-elf-ubuntu-24.04-gcc.tar.xz

          # Extract it to a local directory
          mkdir -p ${{ github.workspace }}/riscv-toolchain
          tar -xJf riscv32-elf-ubuntu-24.04-gcc.tar.xz -C ${{ github.workspace }}/riscv-toolchain --strip-components=1

          # Add the toolchain to the PATH for subsequent steps
          echo "${{ github.workspace }}/riscv-toolchain/bin" >> $GITHUB_PATH

      - name: Verify Installation
        run: riscv32-unknown-elf-gcc --version

      - name: Determine Rust version
        shell: bash
        run: echo "version=$(echo ${GITHUB_REF} | cut -d/ -f3 | cut -d- -f1 | cut -d. -f1,2,3)" >> $GITHUB_OUTPUT
        id: extract_rust_version

      - name: Install Rust toolchain v${{ steps.extract_rust_version.outputs.version }}
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ steps.extract_rust_version.outputs.version }}
          default: true
          override: true
          target: riscv32imac-unknown-none-elf

      - name: Install riscv32imac-unknown-xous-elf toolchain file
        run: |
          rm -rf $(rustc --print sysroot)/lib/rustlib/riscv32imac-unknown-xous-elf \
          && mkdir -p $(rustc --print sysroot)/lib/rustlib/riscv32imac-unknown-xous-elf/lib \
          && rustc --version | awk '{print $2}' > $(rustc --print sysroot)/lib/rustlib/riscv32imac-unknown-xous-elf/RUST_VERSION

      - name: Build Rust libstd for Xous
        run: |
          export RUST_COMPILER_RT_ROOT=$(pwd)/src/llvm-project/compiler-rt \
          && rm -rf target \
          && cargo build \
            --target riscv32imac-unknown-xous-elf \
            -Zbinary-dep-depinfo \
            --release \
            --features "panic-unwind compiler-builtins-c compiler-builtins-mem" \
            --manifest-path "library/sysroot/Cargo.toml" \
          && find \
            library/target/riscv32imac-unknown-xous-elf/release/build \
            \( -name '*.rlib' -o -name '*.rmeta' \) \
            -exec cp {} "$(rustc --print sysroot)/lib/rustlib/riscv32imac-unknown-xous-elf/lib" \; \
          && (dest=$(pwd) && cd $(rustc --print sysroot) && zip -r \
            ${dest}/riscv32imac-unknown-xous_${{ steps.extract_rust_version.outputs.version }}.zip \
            lib/rustlib/riscv32imac-unknown-xous-elf/)
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 0
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 3
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: false
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: -Cforce-unwind-tables=yes -Cembed-bitcode=yes -Zforce-unstable-if-unmarked
          __CARGO_DEFAULT_LIB_METADATA: stablestd
          CC: riscv32-unknown-elf-gcc
          AR: riscv32-unknown-elf-ar

      - name: Install riscv32emc-unknown-none-elf toolchain file
        run: |
          rm -rf $(rustc --print sysroot)/lib/rustlib/riscv32emc-unknown-none-elf \
          && mkdir -p $(rustc --print sysroot)/lib/rustlib/riscv32emc-unknown-none-elf/lib \
          && rustc --version | awk '{print $2}' > $(rustc --print sysroot)/lib/rustlib/riscv32emc-unknown-none-elf/RUST_VERSION

      - name: Build Rust libstd for BIO
        run: |
          export RUST_COMPILER_RT_ROOT=$(pwd)/src/llvm-project/compiler-rt \
          && rm -rf target \
          && cargo build \
            --target riscv32emc-unknown-none-elf \
            -Zbinary-dep-depinfo \
            --release \
            --features "compiler-builtins-c compiler-builtins-mem" \
            --manifest-path "library/alloc/Cargo.toml" \
          && find \
            library/target/riscv32emc-unknown-none-elf/release/build \
            \( -name '*.rlib' -o -name '*.rmeta' \) \
            -exec cp {} "$(rustc --print sysroot)/lib/rustlib/riscv32emc-unknown-none-elf/lib" \; \
          && (dest=$(pwd) && cd $(rustc --print sysroot) && zip -r \
            ${dest}/riscv32emc-unknown-none_${{ steps.extract_rust_version.outputs.version }}.zip \
            lib/rustlib/riscv32emc-unknown-none-elf/)
        env:
          CARGO_PROFILE_RELEASE_DEBUG: 0
          CARGO_PROFILE_RELEASE_OPT_LEVEL: 3
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: false
          CFLAGS_riscv32emc_unknown_none_elf: -mabi=ilp32e
          RUSTC_BOOTSTRAP: 1
          RUSTFLAGS: -Cforce-unwind-tables=yes -Cembed-bitcode=yes -Zforce-unstable-if-unmarked
          __CARGO_DEFAULT_LIB_METADATA: stablestd
          CC: riscv32-unknown-elf-gcc
          AR: riscv32-unknown-elf-ar

      - name: Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            riscv32imac-unknown-xous_${{ steps.extract_rust_version.outputs.version }}.zip
            riscv32emc-unknown-none_${{ steps.extract_rust_version.outputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
